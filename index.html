<!DOCTYPE HTML>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Mega Mindy Capsule Spel</title>
    <style>
        body { background-color: #111; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        #game-container { width: 800px; height: 600px; margin: 20px auto; border: 3px solid #e3007e; }
    </style>
</head>
<body>

    <h1>Mega Mindy Capsule Spel (2015)</h1>
    
    <div id="game-container"></div>

    <!-- Ruffle inladen via CDN -->
    <script src="https://unpkg.com"></script>
    
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("DOMContentLoaded", () => {
            let ruffle = window.RufflePlayer.newest();
            let player = ruffle.createPlayer();
            let container = document.getElementById("game-container");
            container.appendChild(player);
            
            // Hier staat exact de naam van jouw bestand ingevuld:
            player.load("MegaMindyCapsuleSpelVersion2015.swf"); 
        });
    </script>

</body>
</html>
